<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M&N Foods LLC Dashboard</title>

<style>
:root{
  --bg:#f5f7fa;
  --card:#fff;
  --text:#172033;
  --muted:#667085;
  --line:#e4e8ef;
  --blue:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#ea580c;
  --purple:#7c3aed;
  --shadow:0 2px 12px rgba(20,32,55,.06)
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

.app{
  display:flex;
  min-height:100vh
}

.side{
  width:92px;
  background:#fff;
  overflow-y:auto;
  overflow-x:hidden;
  border-right:1px solid var(--line);
  padding:18px 10px;
  position:fixed;
  inset:0 auto 0 0;
  z-index:5
}

.brand{
  font-weight:800;
  text-align:center;
  font-size:11px;
  margin-bottom:22px
}

.brand-icon{
  width:42px;
  height:42px;
  border:2px solid #22a559;
  border-radius:12px;
  display:grid;
  place-items:center;
  margin:auto auto 6px;
  font-size:21px
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  border-radius:12px;
  padding:10px 4px;
  margin:3px 0;
  color:#344054;
  font-size:11px
}

.nav button.active,
.nav button:hover{
  background:#eef8f1;
  color:#16803d
}

.nav .ico{
  font-size:20px;
  display:block;
  margin-bottom:3px
}

.main{
  margin-left:92px;
  width:calc(100% - 92px);
  min-width:0;
  overflow-x:hidden
}

.top{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:16px 26px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px
}

.greet h1{
  margin:0;
  font-size:25px
}

.greet p{
  margin:2px 0 0;
  color:var(--muted)
}

.top-actions{
  display:flex;
  gap:9px;
  align-items:center
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:9px 13px;
  font-weight:650;
  color:#25324a
}

.btn.primary{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff
}

.btn.green{
  background:#eaf8ef;
  border-color:#bce8ca;
  color:#15783b
}

.btn.small{
  padding:6px 9px;
  font-size:13px
}

.content{
  padding:16px 24px 30px;
  max-width:1600px;
  margin:auto
}

.filters{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:12px
}

.filters strong{
  font-size:12px;
  margin-right:3px
}

.filter{
  border:1px solid var(--line);
  background:#fff;
  border-radius:9px;
  padding:7px 11px;
  color:#344054
}

.filter.active{
  background:#eaf8ef;
  border-color:#9ed8b0;
  color:#18783c
}

.locations{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:12px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow)
}

.location{
  padding:13px
}

.lochead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px
}

.locname{
  font-size:17px;
  font-weight:750
}

.pill{
  font-size:11px;
  font-weight:700;
  border-radius:99px;
  padding:4px 8px
}

.pill.red{
  background:#fff0f0;
  color:#b42318
}

.pill.orange{
  background:#fff4e8;
  color:#b54708
}

.pill.green{
  background:#edf9f0;
  color:#18783c
}

.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px
}

.metric{
  text-align:center;
  border-right:1px solid var(--line);
  padding:4px
}

.metric:last-child{
  border:0
}

.metric b{
  display:block;
  font-size:17px
}

.metric span{
  font-size:10px;
  color:var(--muted)
}

.location a{
  display:block;
  margin-top:9px;
  color:#16803d;
  font-weight:650;
  font-size:13px;
  cursor:pointer
}

.grid{
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(0,.95fr) minmax(0,1.1fr);
  gap:10px;
  margin-bottom:10px
}

.section{
  padding:14px
}

.section h2{
  font-size:16px;
  margin:0
}

.sub{
  color:var(--muted);
  font-size:12px
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  gap:10px
}

.count{
  background:#edf3ff;
  color:#2454b5;
  border-radius:99px;
  padding:2px 7px;
  font-size:11px
}

.task{
  display:grid;
  grid-template-columns:22px 1fr auto;
  gap:8px;
  align-items:center;
  padding:9px 0;
  border-bottom:1px solid #eef1f5
}

.task:last-child{
  border-bottom:0
}

.task input{
  width:17px;
  height:17px
}

.task-title{
  font-weight:650
}

.task-meta{
  font-size:11px;
  color:var(--muted)
}

.tag{
  font-size:10px;
  border-radius:6px;
  padding:3px 6px;
  background:#f3f5f8;
  color:#475467;
  white-space:nowrap
}

.calendar-tag{
  background:#fff1f0;
  color:#c43225
}

.priority-row{
  display:grid;
  grid-template-columns:34px 35px 1fr 18px;
  align-items:center;
  gap:8px;
  padding:9px 0;
  border-bottom:1px solid #eef1f5
}

.priority-icon{
  width:30px;
  height:30px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-weight:800
}

.redbg{
  background:#fff0f0;
  color:#d92d20
}

.orangebg{
  background:#fff4e8;
  color:#dc6803
}

.bluebg{
  background:#edf4ff;
  color:#2563eb
}

.week{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-top:9px
}

.day{
  border:1px solid var(--line);
  border-radius:9px;
  padding:7px 3px;
  text-align:center
}

.day.today{
  border-color:#70c58d;
  background:#f1fbf4
}

.day .dow{
  font-size:10px;
  color:var(--muted)
}

.day b{
  display:block;
  font-size:14px
}

.day span{
  font-size:10px;
  color:#18783c
}

.reports{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.report{
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px
}

.report b{
  display:block;
  font-size:21px
}

.report span{
  font-size:11px;
  color:var(--muted)
}

.report-actions{
  display:flex;
  gap:7px;
  margin-top:10px;
  flex-wrap:wrap
}

.bottom{
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr) minmax(0,.9fr);
  gap:10px
}

.quick{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:7px
}

.quick button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:10px 4px;
  font-size:11px
}

.quick .qico{
  font-size:20px;
  display:block;
  margin-bottom:4px
}

.activity,
.nudge{
  display:grid;
  gap:6px
}

.activity div,
.nudge div{
  padding:7px 0;
  border-bottom:1px solid #eef1f5;
  font-size:12px
}

.integration{
  margin-top:10px
}

.integration-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  margin-top:7px;
  gap:10px
}

.status{
  font-size:11px;
  color:var(--green);
  font-weight:700
}

.footer{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
  padding-top:12px;
  gap:10px
}

.page{
  display:none
}

.page.active{
  display:block
}

.table{
  width:100%;
  border-collapse:collapse
}

.table th,
.table td{
  text-align:left;
  border-bottom:1px solid var(--line);
  padding:9px;
  font-size:13px
}

.table th{
  color:#667085;
  font-size:11px
}

.formgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:4px
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #d9dee8;
  border-radius:9px;
  padding:9px;
  background:#fff
}

.field textarea{
  min-height:80px
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(16,24,40,.35);
  display:none;
  place-items:center;
  z-index:20;
  padding:20px
}

.modal.show{
  display:grid
}

.modal-box{
  background:#fff;
  border-radius:15px;
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  padding:18px;
  box-shadow:0 20px 50px rgba(0,0,0,.18)
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px
}

.close{
  border:0;
  background:#f2f4f7;
  border-radius:50%;
  width:32px;
  height:32px
}

.notice{
  padding:10px 12px;
  border-radius:9px;
  background:#f4f8ff;
  color:#344054;
  font-size:12px;
  margin-bottom:10px
}

.notice.success{
  background:#edf9f0;
  color:#18783c
}

.notice.warning{
  background:#fff4e8;
  color:#b54708
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#172033;
  color:#fff;
  padding:10px 14px;
  border-radius:10px;
  display:none;
  z-index:50
}

.toast.show{
  display:block
}

.calendar-event{
  border:1px solid #e4e8ef;
  border-radius:10px;
  padding:10px;
  margin-top:7px;
  background:#fff
}

.calendar-event-title{
  font-weight:700
}

.calendar-event-meta{
  color:var(--muted);
  font-size:11px;
  margin-top:3px
}

.sync-box{
  border:1px solid #d8e7ff;
  background:#f7faff;
  border-radius:12px;
  padding:13px;
  margin-bottom:12px
}

.sync-status{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap
}

.source-icon{
  font-size:14px;
  margin-right:3px
}

@media(max-width:1100px){
  .grid,
  .bottom{
    grid-template-columns:1fr 1fr
  }

  .grid .section:first-child{
    grid-column:1/-1
  }

  .locations{
    grid-template-columns:1fr
  }

  .quick{
    grid-template-columns:repeat(3,1fr)
  }
}

@media(max-width:720px){
  .side{
    width:64px
  }

  .main{
    margin-left:64px;
    width:calc(100% - 64px)
  }

  .top{
    padding:12px 14px
  }

  .content{
    padding:12px
  }

  .top-actions .btn:not(.primary){
    display:none
  }

  .greet h1{
    font-size:19px
  }

  .grid,
  .bottom{
    grid-template-columns:1fr
  }

  .metrics{
    grid-template-columns:repeat(2,1fr)
  }

  .metric:nth-child(2){
    border:0
  }

  .formgrid{
    grid-template-columns:1fr
  }

  .footer{
    display:block
  }

  .footer span{
    display:block;
    margin-top:4px
  }

  .table{
    min-width:700px
  }

  .section{
    overflow-x:auto
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="side">

  <div class="brand">
    <div class="brand-icon">🍴</div>
    M&N FOODS<br>
    <span style="font-weight:500">LLC</span>
  </div>

  <nav class="nav" id="nav"></nav>

</aside>

<main class="main">

<header class="top">

  <div class="greet">
    <h1 id="greeting">Good morning! 👋</h1>
    <p id="dateLine"></p>
  </div>

  <div class="top-actions">

    <button class="btn" onclick="openNudge()">
      🔔 <span id="nudgeBadge">0</span>
    </button>

    <button class="btn" onclick="switchUser()">
      👤 <span id="userName">Dianne</span> ▾
    </button>

  </div>

</header>

<div class="content">

<section id="home" class="page active"></section>

<section id="tasks" class="page"></section>

<section id="payments" class="page"></section>

<section id="purchasing" class="page"></section>

<section id="projects" class="page"></section>

<section id="reports" class="page"></section>

<section id="reminders" class="page"></section>

<section id="nudges" class="page"></section>

<section id="activity" class="page"></section>

<section id="settings" class="page"></section>

</div>

</main>

</div>

<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle" style="margin:0"></h2>

      <button class="close" onclick="closeModal()">×</button>

    </div>

    <div id="modalBody"></div>

  </div>

</div>

<div class="toast" id="toast"></div>


<script>

/* ============================================================
   USERS / LOCATIONS / DEPARTMENTS
============================================================ */

const USERS = [
  {name:"Dianne",role:"Admin"},
  {name:"Naveen",role:"CEO"},
  {name:"Dinos",role:"Staff"},
  {name:"Albert",role:"Staff"}
];

const LOCS = [
  "BK 1869",
  "BK 2127",
  "BK 20769"
];

const DEPTS = [
  "Admin",
  "Purchasing",
  "Maintenance & Repair",
  "General"
];


/* ============================================================
   GOOGLE CALENDAR CONFIGURATION
============================================================ */

const GOOGLE_CLIENT_ID =
"800135193925-jes7bcbtlhf9s023k6lifj1f9asmd98m.apps.googleusercontent.com";

const CALENDAR_SCOPE =
"https://www.googleapis.com/auth/calendar";

const CALENDAR_ID = "primary";

let calendarTokenClient = null;
let calendarAccessToken = null;


/* ============================================================
   APPLICATION STATE
============================================================ */

const DEFAULT_STATE = {

  user:"Dianne",

  dept:"All",

  loc:"All",

  tasks:[

    {
      id:1,
      title:"Approve vendor payment",
      detail:"Invoice #INV-2451",
      loc:"BK 1869",
      dept:"Purchasing",
      due:"2026-08-12",
      time:"10:00 AM",
      priority:"High",
      done:false,
      assignee:"Naveen",
      source:"Dashboard"
    },

    {
      id:2,
      title:"Follow up on freezer repair",
      detail:"Walk-in cooler not cooling",
      loc:"BK 2127",
      dept:"Maintenance & Repair",
      due:"2026-08-12",
      time:"Today",
      priority:"Medium",
      done:false,
      assignee:"Dinos",
      source:"Dashboard"
    },

    {
      id:3,
      title:"Submit payroll documents",
      detail:"Weekly payroll report",
      loc:"All Locations",
      dept:"Admin",
      due:"2026-08-12",
      time:"Today",
      priority:"High",
      done:false,
      assignee:"Dianne",
      source:"Dashboard"
    },

    {
      id:4,
      title:"Order replacement part",
      detail:"Condenser fan motor",
      loc:"BK 20769",
      dept:"Purchasing",
      due:"2026-08-12",
      time:"2:00 PM",
      priority:"Medium",
      done:false,
      assignee:"Albert",
      source:"Dashboard"
    },

    {
      id:5,
      title:"Daily sales summary",
      detail:"July 11, 2026",
      loc:"All Locations",
      dept:"General",
      due:"2026-08-11",
      time:"Completed",
      priority:"Low",
      done:true,
      assignee:"Dianne",
      source:"Dashboard"
    },

    {
      id:6,
      title:"Review vendor quote",
      detail:"Arctic Refrigeration",
      loc:"BK 2127",
      dept:"Purchasing",
      due:"2026-08-13",
      time:"Tomorrow",
      priority:"Medium",
      done:false,
      assignee:"Naveen",
      source:"Dashboard"
    }

  ],

  payments:[
    {
      id:11,
      title:"Vendor payment",
      amount:1250,
      loc:"BK 2127",
      status:"Pending",
      due:"2026-08-12"
    }
  ],

  purchases:[
    {
      id:21,
      title:"Replacement part",
      amount:480,
      loc:"BK 20769",
      status:"Pending",
      requester:"Albert"
    }
  ],

  projects:[],

  nudges:[],

  activity:[
    "Naveen added a payment of $1,250.00 for BK 2127",
    "Dinos updated task “Freezer repair” for BK 2127",
    "Albert marked “Daily sales summary” as completed",
    "Dianne added a purchase request for BK 1869"
  ],

  reminder:{
    enabled:true,
    time:"08:00",
    email:true,
    calendar:true
  },

  connections:{
    email:false,
    calendar:false
  },

  calendarSync:{
    lastSync:null,
    importedCount:0,
    connectedEmail:"",
    calendarName:"Primary Calendar"
  }

};


let state =
  JSON.parse(localStorage.getItem("mnfoods_v2") || "null")
  || DEFAULT_STATE;


/* ============================================================
   SAFETY FOR OLD DATA
============================================================ */

if(!state.calendarSync){

  state.calendarSync = {
    lastSync:null,
    importedCount:0,
    connectedEmail:"",
    calendarName:"Primary Calendar"
  };

}

if(!Array.isArray(state.tasks)) state.tasks=[];
if(!Array.isArray(state.payments)) state.payments=[];
if(!Array.isArray(state.purchases)) state.purchases=[];
if(!Array.isArray(state.projects)) state.projects=[];
if(!Array.isArray(state.nudges)) state.nudges=[];
if(!Array.isArray(state.activity)) state.activity=[];


/* ============================================================
   BASIC HELPERS
============================================================ */

let page = "home";


function save(){

  localStorage.setItem(
    "mnfoods_v2",
    JSON.stringify(state)
  );

}


function esc(s){

  return String(s ?? "")
    .replace(/[&<>"']/g,m=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[m]));

}


function today(){

  return new Date().toISOString().slice(0,10);

}


function fmtMoney(n){

  return new Intl.NumberFormat(
    "en-US",
    {
      style:"currency",
      currency:"USD",
      maximumFractionDigits:2
    }
  ).format(Number(n)||0);

}


function formatDate(dateString){

  if(!dateString) return "";

  const d = new Date(dateString + "T00:00:00");

  return d.toLocaleDateString(
    "en-US",
    {
      month:"short",
      day:"numeric",
      year:"numeric"
    }
  );

}


function formatCalendarDateTime(event){

  if(event.start?.date){

    return formatDate(event.start.date) + " • All day";

  }

  if(event.start?.dateTime){

    const d = new Date(event.start.dateTime);

    return d.toLocaleString(
      "en-US",
      {
        month:"short",
        day:"numeric",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }

  return "";

}


function formatCalendarTaskDate(event){

  if(event.start?.date){

    return event.start.date;

  }

  if(event.start?.dateTime){

    return new Date(event.start.dateTime)
      .toISOString()
      .slice(0,10);

  }

  return today();

}


function formatCalendarTaskTime(event){

  if(event.start?.date){

    return "All day";

  }

  if(event.start?.dateTime){

    return new Date(event.start.dateTime)
      .toLocaleTimeString(
        "en-US",
        {
          hour:"numeric",
          minute:"2-digit"
        }
      );

  }

  return "";

}


function toast(message){

  const t = document.getElementById("toast");

  t.textContent = message;

  t.classList.add("show");

  setTimeout(
    ()=>t.classList.remove("show"),
    2500
  );

}


/* ============================================================
   FILTERS
============================================================ */

function filteredTasks(){

  return state.tasks.filter(
    t =>
      (state.dept==="All" || t.dept===state.dept)
      &&
      (state.loc==="All" || t.loc===state.loc)
  );

}


function openTasks(){

  return filteredTasks()
    .filter(t=>!t.done);

}


function setDept(d){

  state.dept=d;

  save();

  render();

}


function setLoc(l){

  state.loc=l;

  save();

  render();

}


function filters(){

  return `

    <div class="filters">

      <strong>DEPARTMENT:</strong>

      ${["All",...DEPTS].map(d=>`

        <button
          class="filter ${state.dept===d?"active":""}"
          onclick="setDept('${esc(d)}')"
        >
          ${esc(d)}
        </button>

      `).join("")}

    </div>

  `;

}


/* ============================================================
   NAVIGATION
============================================================ */

function nav(){

  const items = [

    ["home","⌂","Home"],
    ["tasks","☑","Tasks"],
    ["payments","$","Payments"],
    ["purchasing","🛒","Purchasing"],
    ["projects","▣","Projects"],
    ["reports","▥","Reports"],
    ["reminders","♧","Reminders"],
    ["nudges","📣","Nudge Center"],
    ["activity","◷","Activity"],
    ["settings","⚙","Settings"]

  ];

  document.getElementById("nav").innerHTML =

    items.map(x=>`

      <button
        class="${page===x[0]?"active":""}"
        onclick="go('${x[0]}')"
      >

        <span class="ico">${x[1]}</span>

        ${x[2]}

      </button>

    `).join("");

}


function go(p){

  page=p;

  document
    .querySelectorAll(".page")
    .forEach(x=>x.classList.remove("active"));

  document
    .getElementById(p)
    .classList.add("active");

  render();

  nav();

  window.scrollTo(0,0);

}

function toggleTask(id){

  const t =
    state.tasks.find(x=>x.id===id);

  if(!t) return;

  t.done = !t.done;

  state.activity.unshift(

    `${state.user} ${
      t.done ? "completed" : "reopened"
    } task “${t.title}”`

  );

  save();

  render();

}

/* ============================================================
   SAVE FORM
============================================================ */

async function saveForm(type){

  const title =
    document
      .getElementById("f_title")
      ?.value
      .trim();


  if(!title){

    toast("Please enter a name.");

    return;

  }


  if(type==="payment"){

    state.payments.push({

      id:Date.now(),

      title,

      amount:Number(
        document.getElementById("f_amount").value || 0
      ),

      loc:
        document.getElementById("f_loc").value,

      status:"Pending",

      due:
        document.getElementById("f_due").value

    });

  }


  else if(type==="purchase"){

    state.purchases.push({

      id:Date.now(),

      title,

      amount:Number(
        document.getElementById("f_amount").value || 0
      ),

      loc:
        document.getElementById("f_loc").value,

      status:"Pending",

      requester:
        document.getElementById("f_assignee").value

    });

  }


  else if(type==="project"){

    state.projects.push({

      id:Date.now(),

      title,

      loc:
        document.getElementById("f_loc").value,

      status:"Open"

    });

  }


  else{

    const task = {

      id:Date.now(),

      title,

      detail:
        document.getElementById("f_detail")?.value || "",

      loc:
        document.getElementById("f_loc").value,

      dept:
        document.getElementById("f_dept").value,

      due:
        document.getElementById("f_due").value,

      time:"Today",

      priority:
        document.getElementById("f_priority").value,

      done:false,

      assignee:
        document.getElementById("f_assignee").value,

      source:"Dashboard"

    };


    state.tasks.push(task);


    const addToCalendar =
      document.getElementById("f_calendar")?.checked;


    if(
      addToCalendar &&
      state.connections.calendar &&
      calendarAccessToken
    ){

      try{

        const event =
          await createGoogleCalendarEventFromTask(task);

        task.googleEventId = event.id;

        task.source = "Dashboard + Google Calendar";

        state.activity.unshift(
          `${state.user} added "${title}" to the dashboard and Google Calendar`
        );

      }

      catch(error){

        console.error(error);

        state.activity.unshift(
          `${state.user} added "${title}" to the dashboard; Google Calendar creation failed`
        );

        toast(
          "Task saved, but Google Calendar creation failed."
        );

      }

    }

  }


  if(
    !state.activity.some(
      x=>x.includes(`added ${type}: ${title}`)
    )
  ){

    state.activity.unshift(
      `${state.user} added ${type}: ${title}`
    );

  }


  save();

  closeModal();

  toast("Saved successfully");

  render();

}

/* ============================================================
   GOOGLE CALENDAR INITIALIZATION
============================================================ */

function initializeGoogleCalendar(){

  if(
    !window.google ||
    !google.accounts ||
    !google.accounts.oauth2
  ){

    toast(
      "Google Calendar is still loading. Please try again."
    );

    return false;

  }


  if(!calendarTokenClient){

    calendarTokenClient =
      google.accounts.oauth2.initTokenClient({

        client_id:GOOGLE_CLIENT_ID,

        scope:CALENDAR_SCOPE,

        callback:""

      });

  }


  return true;

}


/* ============================================================
   CONNECT GOOGLE CALENDAR
============================================================ */

function connectCalendar(){

  if(!initializeGoogleCalendar()){

    return;

  }


  calendarTokenClient.callback =
    async function(response){

      if(response.error){

        console.error(
          "Google authorization error:",
          response
        );

        toast(
          "Google Calendar authorization was cancelled."
        );

        return;

      }


      calendarAccessToken =
        response.access_token;


      state.connections.calendar = true;

      save();

      toast(
        "Google Calendar connected! Syncing..."
      );


      try{

        await syncGoogleCalendar();

      }

      catch(error){

        console.error(error);

        toast(
          "Connected, but calendar sync failed."
        );

      }


      render();

    };


  calendarTokenClient.requestAccessToken({

    prompt:
      calendarAccessToken
        ? ""
        : "consent"

  });

}


/* ============================================================
   GOOGLE CALENDAR API REQUEST
============================================================ */

async function calendarRequest(
  url,
  options={}
){

  if(!calendarAccessToken){

    throw new Error(
      "No Google Calendar access token."
    );

  }


  const headers = {

    Authorization:
      "Bearer " + calendarAccessToken,

    ...(options.headers || {})

  };


  const response =
    await fetch(
      url,
      {
        ...options,
        headers
      }
    );


  if(response.status===401){

    calendarAccessToken = null;

    throw new Error(
      "Google Calendar authorization expired."
    );

  }


  if(!response.ok){

    const text =
      await response.text();

    throw new Error(
      `Google Calendar API error ${response.status}: ${text}`
    );

  }


  return response.json();

}


/* ============================================================
   SYNC GOOGLE CALENDAR → DASHBOARD
============================================================ */

async function syncGoogleCalendar(){

  if(!initializeGoogleCalendar()){

    return;

  }


  if(!calendarAccessToken){

    toast(
      "Please connect Google Calendar first."
    );

    connectCalendar();

    return;

  }


  toast(
    "Syncing Google Calendar..."
  );


  try{

    /*
      Pull events from today through the next 90 days.

      Google Calendar's events.list supports:
      - timeMin
      - timeMax
      - singleEvents
      - orderBy
      - showDeleted
    */

    const start =
      new Date();

    start.setHours(
      0,0,0,0
    );


    const end =
      new Date(start);

    end.setDate(
      end.getDate()+90
    );


    const url =
      "https://www.googleapis.com/calendar/v3/calendars/"
      + encodeURIComponent(CALENDAR_ID)
      + "/events?"
      + new URLSearchParams({

        timeMin:start.toISOString(),

        timeMax:end.toISOString(),

        singleEvents:"true",

        orderBy:"startTime",

        showDeleted:"false",

        maxResults:"2500"

      }).toString();


    const data =
      await calendarRequest(url);


    const events =
      data.items || [];


    let imported = 0;

    let updated = 0;


    for(const event of events){

      /*
        Ignore events without a usable start.
      */

      if(
        !event.start ||
        (!event.start.date &&
         !event.start.dateTime)
      ){

        continue;

      }


      /*
        If the calendar event already exists
        in the dashboard, update it rather than
        creating another copy.
      */

      let existing =
        state.tasks.find(
          t=>t.googleEventId===event.id
        );


      const due =
        formatCalendarTaskDate(event);

      const time =
        formatCalendarTaskTime(event);


      const detail =
        event.description
        ||
        event.location
        ||
        "Google Calendar event";


      if(existing){

        /*
          Keep completion state controlled by dashboard.
          But refresh the title/date/time/details
          from Google Calendar.
        */

        existing.title =
          event.summary ||
          "(Untitled Calendar Event)";

        existing.detail =
          detail;

        existing.due =
          due;

        existing.time =
          time;

        existing.googleEventUpdated =
          event.updated || null;

        existing.calendarHtmlLink =
          event.htmlLink || "";

        updated++;

        continue;

      }


      /*
        New Google Calendar event.
      */

      const newTask = {

        id:Date.now()
          + Math.floor(Math.random()*100000),

        title:
          event.summary ||
          "(Untitled Calendar Event)",

        detail,

        loc:"All Locations",

        dept:"General",

        due,

        time,

        priority:"Medium",

        done:false,

        assignee:state.user,

        source:"Google Calendar",

        googleEventId:event.id,

        googleEventUpdated:
          event.updated || null,

        calendarHtmlLink:
          event.htmlLink || "",

        calendarEventType:
          event.eventType || "default"

      };


      state.tasks.push(
        newTask
      );


      imported++;

    }


    state.calendarSync.lastSync =
      new Date().toISOString();


    state.calendarSync.importedCount =
      imported;


    state.activity.unshift(

      `${state.user} synced Google Calendar: ${imported} new event${imported===1?"":"s"} imported${updated ? `, ${updated} updated` : ""}`

    );


    state.connections.calendar = true;


    save();


    toast(

      `Calendar synced: ${imported} new, ${updated} updated`

    );


    render();

  }

  catch(error){

    console.error(
      "Google Calendar sync failed:",
      error
    );


    /*
      If the token expired, Google requires
      the user-driven requestAccessToken()
      flow again.
    */

    if(
      error.message.includes(
        "authorization expired"
      )
    ){

      toast(
        "Calendar authorization expired. Click Sync again to reconnect."
      );

    }

    else{

      toast(
        "Google Calendar sync failed. Check the console for details."
      );

    }

  }

}


/* ============================================================
   DASHBOARD TASK → GOOGLE CALENDAR
============================================================ */

async function createGoogleCalendarEventFromTask(task){

  if(!calendarAccessToken){

    throw new Error(
      "Google Calendar is not connected."
    );

  }


  /*
    Use a one-hour event.

    If the dashboard task only has a date,
    create it as an all-day calendar event.
  */


  let event;


  if(
    !task.time ||
    task.time==="Today" ||
    task.time==="Tomorrow" ||
    task.time==="All day"
  ){

    const startDate =
      task.due;


    const d =
      new Date(
        startDate + "T00:00:00"
      );


    const next =
      new Date(d);

    next.setDate(
      next.getDate()+1
    );


    event = {

      summary:task.title,

      description:
        task.detail ||
        "M&N Foods Dashboard Task",

      start:{
        date:startDate
      },

      end:{
        date:
          next.toISOString()
          .slice(0,10)
      }

    };

  }

  else{

    /*
      Convert "10:00 AM" to 24-hour time.
    */

    const parsed =
      parseTimeString(
        task.time
      );


    if(!parsed){

      event = {

        summary:task.title,

        description:
          task.detail ||
          "M&N Foods Dashboard Task",

        start:{
          date:task.due
        },

        end:{
          date:
            new Date(
              new Date(task.due+"T00:00:00")
                .getTime()
                + 86400000
            )
            .toISOString()
            .slice(0,10)
        }

      };

    }

    else{

      const start =
        new Date(
          `${task.due}T${parsed.hours}:${parsed.minutes}:00`
        );


      const end =
        new Date(
          start.getTime()+60*60*1000
        );


      event = {

        summary:task.title,

        description:
          task.detail ||
          "M&N Foods Dashboard Task",

        start:{
          dateTime:start.toISOString()
        },

        end:{
          dateTime:end.toISOString()
        }

      };

    }

  }


  const url =
    "https://www.googleapis.com/calendar/v3/calendars/"
    + encodeURIComponent(CALENDAR_ID)
    + "/events";


  return calendarRequest(

    url,

    {

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify(event)

    }

  );

}


/* ============================================================
   TIME PARSER
============================================================ */

function parseTimeString(value){

  if(!value) return null;


  const match =
    String(value)
      .trim()
      .match(
        /^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)$/i
      );


  if(!match) return null;


  let hours =
    parseInt(match[1],10);

  const minutes =
    parseInt(match[2] || "00",10);


  const ampm =
    match[3].toUpperCase();


  if(ampm==="PM" && hours!==12){

    hours += 12;

  }


  if(ampm==="AM" && hours===12){

    hours = 0;

  }


  return {

    hours:
      String(hours).padStart(2,"0"),

    minutes:
      String(minutes).padStart(2,"0")

  };

}


/* ============================================================
   SWITCH USER
============================================================ */

function switchUser(){

  let i =
    USERS.findIndex(
      x=>x.name===state.user
    );


  state.user =
    USERS[
      (i+1)%USERS.length
    ].name;


  save();

  toast(
    "Switched to " + state.user
  );

  render();

}

      "Location",
      "Department",
      "Amount",
      "Due/Status",
      "Assigned",
      "Source"
    ],

    ...state.tasks.map(
      t=>[

        t.title,
        t.loc,
        t.dept,
        "",
        t.due,
        t.assignee,
        t.source || "Dashboard"
      ]
    ),

    ...state.payments.map(
      p=>[
        "Payment",
        p.title,
        p.loc,
        "",
        p.amount,
        p.status,
        p.due,
        "Dashboard"
      ]
    ),

    ...state.purchases.map(
      p=>[
        "Purchase",
        p.title,
        p.loc,
        "",
        p.amount,
        p.status,
        p.requester,
        "Dashboard"
      ]
    )

  ];


  const table =

    "<table><tr>"
    +

    rows[0]
      .map(
        x=>"<th>"+esc(x)+"</th>"
      )
      .join("")

    +

    "</tr>"

    +

    rows
      .slice(1)
      .map(
        r=>
          "<tr>"
          +
          r.map(
            x=>"<td>"+esc(x)+"</td>"
          ).join("")
          +
          "</tr>"
      )
      .join("")

    +

    "</table>";


  const blob =
    new Blob(

      [
        "<html><head><meta charset='utf-8'>"
        +
        "</head><body>"
        +
        table
        +
        "</body></html>"
      ],

      {
        type:
          "application/vnd.ms-excel"
      }

    );


  const a =
    document.createElement("a");


  a.href =
    URL.createObjectURL(blob);


  a.download =
    "MN_Foods_Report.xls";


  a.click();


  URL.revokeObjectURL(
    a.href
  );


  toast(
    "Excel report exported"
  );

}

  let dt =
    start
      .toISOString()
      .replace(/[-:]/g,"")

/* ============================================================
   GOOGLE CALENDAR EVENTS LIST MODAL
============================================================ */

async function showGoogleCalendarEvents(){

  if(!calendarAccessToken){

    toast(
      "Connect Google Calendar first."
    );

    return;

  }


  try{

    const start =
      new Date();

    start.setHours(0,0,0,0);


    const end =
      new Date(start);

    end.setDate(
      end.getDate()+30
    );


    const url =
      "https://www.googleapis.com/calendar/v3/calendars/"
      + encodeURIComponent(CALENDAR_ID)
      + "/events?"
      + new URLSearchParams({

        timeMin:start.toISOString(),

        timeMax:end.toISOString(),

        singleEvents:"true",

        orderBy:"startTime",

        maxResults:"100"

      }).toString();


    const data =
      await calendarRequest(url);


    const events =
      data.items || [];


    document.getElementById(
      "modalTitle"
    ).textContent =
      "Google Calendar Events";


    document.getElementById(
      "modalBody"
    ).innerHTML = `

      <div class="notice success">

        Found
        <b>${events.length}</b>
        upcoming Google Calendar event${events.length===1?"":"s"}.

      </div>


      ${
        events.map(event=>`

          <div class="calendar-event">

            <div class="calendar-event-title">

              📅
              ${esc(
                event.summary ||
                "(Untitled Event)"
              )}

            </div>

            <div class="calendar-event-meta">

              ${esc(
                formatCalendarDateTime(event)
              )}

            </div>


            ${
              event.description
                ? `
                  <div
                    class="calendar-event-meta"
                    style="margin-top:5px"
                  >
                    ${esc(event.description)}
                  </div>
                `
                : ""
            }


            ${
              event.htmlLink
                ? `
                  <div style="margin-top:6px">
                    <a
                      href="${esc(event.htmlLink)}"
                      target="_blank"
                      rel="noopener"
                    >
                      Open in Google Calendar →
                    </a>
                  </div>
                `
                : ""
            }

          </div>

        `).join("")

        ||

        '<div class="sub">No upcoming events.</div>'

      }


      <div
        style="
          display:flex;
          justify-content:flex-end;
          margin-top:14px
        "
      >

        <button
          class="btn primary"
          onclick="closeModal()"
        >
          Done
        </button>

      </div>

    `;


    document
      .getElementById("modal")
      .classList.add("show");

  }

  catch(error){

    console.error(error);

    toast(
      "Unable to load Google Calendar events."
    );

  }

}
